services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smart_grocery
      POSTGRES_USER: smart_grocery
      POSTGRES_PASSWORD: smart_grocery
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_grocery -d smart_grocery"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      target: api
    command: npm run api:start
    env_file:
      - .env
    environment:
      API_PORT: 4000
      DATABASE_URL: postgresql://smart_grocery:smart_grocery@postgres:5432/smart_grocery?schema=public
      STORAGE_ROOT: /data/storage
      # Local compose serves HTTP via Next rewrites — Secure cookies would break browsers.
      COOKIE_SECURE: "false"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - storage-data:/data/storage

  worker:
    build:
      context: .
      target: worker
    command: npm run worker:start
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://smart_grocery:smart_grocery@postgres:5432/smart_grocery?schema=public
      STORAGE_ROOT: /data/storage
    depends_on:
      postgres:
        condition: service_healthy
    shm_size: "1gb"
    volumes:
      - storage-data:/data/storage

  scheduler:
    build:
      context: .
      target: worker
    command: npx tsx scraper/src/flyers/jobs/flow-scheduler.ts
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://smart_grocery:smart_grocery@postgres:5432/smart_grocery?schema=public
      STORAGE_ROOT: /data/storage
    depends_on:
      postgres:
        condition: service_healthy
    shm_size: "1gb"
    volumes:
      - storage-data:/data/storage

volumes:
  postgres-data:
  storage-data:
